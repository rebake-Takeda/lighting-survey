<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="照明調査">
<title>照明調査アプリ</title>
<style>
:root {
  --blue: #1a6fc4; --blue-light: #e8f1fb; --blue-dark: #0f4d8f;
  --green: #0f7a52; --green-light: #e2f5ed;
  --gray-1: #f5f5f5; --gray-2: #e8e8e8; --gray-3: #b0b0b0; --gray-4: #666;
  --text: #1a1a1a; --border: #ddd; --white: #fff;
  --radius: 12px; --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; font-family: 'Hiragino Sans', sans-serif; background: var(--gray-1); color: var(--text); font-size: 15px; }
.screen { display: none; height: 100vh; flex-direction: column; overflow: hidden; }
.screen.active { display: flex; }

/* Header */
.header { background: var(--white); border-bottom: 1px solid var(--border); padding: 10px 14px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; min-height: 50px; }
.header h1 { font-size: 16px; font-weight: 700; flex: 1; }
.hbtn { background: var(--blue); color: var(--white); border: none; border-radius: var(--radius-sm); padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: inherit; }
.hbtn.green { background: var(--green); }
.hbtn.outline { background: var(--white); color: var(--blue); border: 1.5px solid var(--blue); }
.back-btn { background: none; border: none; color: var(--blue); font-size: 17px; cursor: pointer; padding: 4px 0; flex-shrink: 0; }
.scroll-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* 施設一覧 */
.stats-section { padding: 12px 14px 8px; background: var(--white); border-bottom: 1px solid var(--border); }
.stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.stat-box { background: var(--gray-1); border-radius: var(--radius-sm); padding: 8px; text-align: center; }
.stat-num { font-size: 24px; font-weight: 700; line-height: 1; }
.stat-num.blue { color: var(--blue); }
.stat-num.green { color: var(--green); }
.stat-label { font-size: 11px; color: var(--gray-4); margin-top: 2px; }
.progress-bar { height: 5px; background: var(--gray-2); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--blue); border-radius: 3px; transition: width 0.4s; }
.search-wrap { padding: 8px 14px; background: var(--white); border-bottom: 1px solid var(--border); }
.search-input { width: 100%; background: var(--gray-1); border: 1px solid var(--gray-2); border-radius: 10px; padding: 8px 12px; font-size: 14px; color: var(--text); outline: none; font-family: inherit; }
.facility-list { padding-bottom: 16px; }
.date-header { padding: 7px 14px 3px; font-size: 12px; font-weight: 700; color: var(--gray-4); background: var(--gray-1); border-bottom: 1px solid var(--gray-2); border-top: 1px solid var(--gray-2); margin-top: 6px; }
.fac-item { background: var(--white); padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; cursor: pointer; }
.fac-item:active { background: var(--blue-light); }
.fac-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: var(--gray-2); }
.fac-dot.done { background: var(--green); }
.fac-main { flex: 1; min-width: 0; }
.fac-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fac-addr { font-size: 11px; color: var(--gray-4); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fac-time { font-size: 11px; color: var(--blue); margin-top: 2px; font-weight: 500; }
.fac-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 20px; white-space: nowrap; }
.badge-done { background: var(--green-light); color: var(--green); }
.badge-todo { background: var(--gray-1); color: var(--gray-3); border: 1px solid var(--gray-2); }
.fac-cnt { font-size: 11px; color: var(--gray-4); }
.fac-arrow { color: var(--gray-3); font-size: 20px; flex-shrink: 0; }

/* 施設詳細 */
.fac-banner { background: var(--blue); color: var(--white); padding: 12px 14px; flex-shrink: 0; }
.fac-banner h2 { font-size: 16px; font-weight: 700; margin-bottom: 3px; }
.fac-banner p { font-size: 11px; opacity: 0.85; line-height: 1.5; }

/* 調査者選択 */
.surveyor-row { display: flex; align-items: center; gap: 8px; background: var(--white); padding: 10px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.surveyor-label { font-size: 13px; color: var(--gray-4); flex-shrink: 0; }
.s-chip { padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--gray-2); background: var(--white); color: var(--gray-4); }
.s-chip.sel { background: var(--blue); border-color: var(--blue); color: var(--white); }

/* スプレッドシート風テーブル */
.sheet-wrap { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; position: relative; }
.sheet-table { border-collapse: collapse; width: max-content; min-width: 100%; font-size: 13px; }
.sheet-table th { background: #2c3e50; color: #fff; font-size: 11px; font-weight: 600; padding: 8px 8px; border: 1px solid #1a252f; white-space: nowrap; text-align: center; position: sticky; top: 0; z-index: 10; min-width: 80px; }
.sheet-table th.col-no { min-width: 36px; width: 36px; background: #34495e; }
.sheet-table th.col-floor { min-width: 80px; }
.sheet-table th.col-room { min-width: 130px; }
.sheet-table th.col-type { min-width: 100px; }
.sheet-table th.col-sub { min-width: 90px; }
.sheet-table th.col-form { min-width: 140px; }
.sheet-table th.col-color { min-width: 80px; }
.sheet-table th.col-num { min-width: 70px; }
.sheet-table th.col-note { min-width: 140px; }
.sheet-table th.col-photo { min-width: 80px; }
.sheet-table th.col-action { min-width: 50px; background: #34495e; }

.sheet-table td { border: 1px solid var(--border); padding: 0; vertical-align: middle; background: var(--white); }
.sheet-table tr:nth-child(even) td { background: #fafafa; }
.sheet-table tr.selected td { background: #e8f4fd !important; }
.sheet-table tr:hover td { background: #f0f7ff !important; }

/* セル入力 */
.cell-input { width: 100%; border: none; background: transparent; font-size: 13px; color: var(--text); padding: 7px 6px; outline: none; font-family: inherit; text-align: left; }
.cell-input:focus { background: #fff9c4; box-shadow: inset 0 0 0 2px var(--blue); }
.cell-select { width: 100%; border: none; background: transparent; font-size: 13px; color: var(--text); padding: 7px 4px; outline: none; font-family: inherit; cursor: pointer; -webkit-appearance: none; }
.cell-select:focus { background: #fff9c4; box-shadow: inset 0 0 0 2px var(--blue); }
.cell-no { text-align: center; color: var(--gray-4); font-size: 12px; padding: 7px 4px; user-select: none; cursor: pointer; }
.cell-photo-btn { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; padding: 6px 4px; background: none; border: none; cursor: pointer; font-size: 12px; color: var(--blue); font-family: inherit; }
.cell-del-btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 6px; background: none; border: none; cursor: pointer; color: #c00; font-size: 18px; }

/* 追加行ボタン */
.add-row-btn { background: var(--white); border: 2px dashed var(--gray-2); color: var(--blue); font-size: 13px; font-weight: 600; padding: 10px; text-align: center; cursor: pointer; width: 100%; display: block; }

/* 写真モーダル */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.active { display: flex; }
.modal { background: var(--white); border-radius: var(--radius); padding: 20px; width: 100%; max-width: 380px; }
.modal h3 { font-size: 15px; font-weight: 700; margin-bottom: 14px; }
.photo-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.photo-thumb { position: relative; width: 80px; height: 80px; }
.photo-thumb img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
.photo-thumb-del { position: absolute; top: -6px; right: -6px; background: #c00; color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 14px; line-height: 20px; text-align: center; cursor: pointer; padding: 0; }
.photo-add-btn { width: 80px; height: 80px; border: 2px dashed var(--gray-2); border-radius: 8px; background: var(--gray-1); color: var(--blue); font-size: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.photo-input { display: none; }
.modal-btns { display: flex; gap: 8px; }
.modal-btn { flex: 1; padding: 11px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; border: none; cursor: pointer; font-family: inherit; }
.modal-btn.primary { background: var(--blue); color: var(--white); }
.modal-btn.secondary { background: var(--gray-1); color: var(--text); }

/* 下部ツールバー */
.bottom-bar { background: var(--white); border-top: 1px solid var(--border); padding: 8px 14px; display: flex; gap: 8px; flex-shrink: 0; }
.bottom-bar .hbtn { flex: 1; padding: 10px; font-size: 13px; }
</style>
</head>
<body>

<!-- ① 施設一覧 -->
<div id="screen-list" class="screen active">
  <div class="header">
    <h1>警察署 照明調査</h1>
  </div>
  <div class="stats-section">
    <div class="stats-row">
      <div class="stat-box"><div class="stat-num green" id="s-done">0</div><div class="stat-label">完了</div></div>
      <div class="stat-box"><div class="stat-num" id="s-rem">86</div><div class="stat-label">未調査</div></div>
      <div class="stat-box"><div class="stat-num blue" id="s-pct">0%</div><div class="stat-label">進捗</div></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>
  </div>
  <div class="search-wrap">
    <input class="search-input" type="text" placeholder="施設名・住所で検索..." oninput="renderList(this.value)">
  </div>
  <div class="scroll-body">
    <div class="facility-list" id="fac-list"></div>
  </div>
</div>

<!-- ② 施設詳細（スプレッドシート） -->
<div id="screen-detail" class="screen">
  <div class="header">
    <button class="back-btn" onclick="goList()">‹ 一覧</button>
    <h1 id="d-title" style="font-size:14px;"></h1>
    <button class="hbtn outline" onclick="triggerImport()" style="font-size:12px">Excel取込</button>
  </div>
  <div class="fac-banner">
    <h2 id="d-name"></h2>
    <p id="d-sub"></p>
  </div>
  <div class="surveyor-row">
    <span class="surveyor-label">調査者</span>
    <span class="s-chip" id="sc-teimoto" onclick="selectSurveyor('定元')">定元</span>
    <span class="s-chip" id="sc-takeda" onclick="selectSurveyor('武田')">武田</span>
  </div>
  <div class="sheet-wrap" id="sheet-wrap">
    <table class="sheet-table" id="sheet-table">
      <thead>
        <tr>
          <th class="col-no">No</th>
          <th class="col-floor">階数</th>
          <th class="col-room">室区分</th>
          <th class="col-type">種類</th>
          <th class="col-sub">灯式・口金</th>
          <th class="col-form">形式</th>
          <th class="col-color">色温度</th>
          <th class="col-num">台数</th>
          <th class="col-num">W数</th>
          <th class="col-num">点灯時間</th>
          <th class="col-num">直径mm</th>
          <th class="col-num">幅mm</th>
          <th class="col-num">深さmm</th>
          <th class="col-num">Φ数</th>
          <th class="col-note">備考</th>
          <th class="col-photo">写真</th>
          <th class="col-action"></th>
        </tr>
      </thead>
      <tbody id="sheet-tbody"></tbody>
    </table>
    <button class="add-row-btn" onclick="addRow()">＋ 行を追加</button>
  </div>
  <div class="bottom-bar">
    <button class="hbtn green" onclick="saveAndExport()">CSV＋写真を保存</button>
    <input type="file" id="import-input" accept=".xlsx,.xls" style="display:none" onchange="importExcel(this)">
  </div>
</div>

<!-- 写真モーダル -->
<div class="modal-overlay" id="photo-modal">
  <div class="modal">
    <h3 id="modal-title">写真登録</h3>
    <div class="photo-row" id="modal-photos"></div>
    <input class="photo-input" id="photo-file-input" type="file" accept="image/*" multiple onchange="handleModalPhoto(this)">
    <div class="modal-btns">
      <button class="modal-btn secondary" onclick="closePhotoModal()">閉じる</button>
      <button class="modal-btn primary" onclick="closePhotoModal()">完了</button>
    </div>
  </div>
</div>

const STORAGE_KEY = 'lighting_survey_data';
function loadSaved() { try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : {}; } catch(e) { return {}; } }
function saveToDB() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(saved)); } catch(e) {} }

const saved = loadSaved();
let currentId = null;
let photoModalRowIdx = -1;

function fmtDate(d) {
  if (!d) return '日程未定';
  const dt = new Date(d + 'T00:00:00');
  return (dt.getMonth()+1)+'月'+dt.getDate()+'日('+'日月火水木金土'[dt.getDay()]+')';
}
function safeName(n) { return n.replace(/[\\/:*?"<>|　]/g, '_'); }

/* ===== 施設一覧 ===== */
function renderList(q='') {
  const done = Object.keys(saved).filter(id => saved[id] && saved[id].records && saved[id].records.length).length;
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-rem').textContent = 86 - done;
  document.getElementById('s-pct').textContent = Math.round(done/86*100)+'%';
  document.getElementById('prog').style.width = (done/86*100).toFixed(1)+'%';
  const sq = q.toLowerCase();
  let html = '', prevDate = null;
  for (const f of FACILITIES) {
    if (sq && !f.name.includes(q) && !f.addr.toLowerCase().includes(sq)) continue;
    if (f.date !== prevDate) {
      prevDate = f.date;
      html += `<div class="date-header">${fmtDate(f.date)}</div>`;
    }
    const isDone = !!(saved[f.id] && saved[f.id].records && saved[f.id].records.length);
    const cnt = isDone ? saved[f.id].records.length : 0;
    html += `<div class="fac-item" onclick="openDetail(${f.id})">
      <div class="fac-dot ${isDone?'done':''}"></div>
      <div class="fac-main">
        <div class="fac-name">${f.name}</div>
        <div class="fac-addr">${f.addr}</div>
        <div class="fac-time">${f.time}　計${f.total}台</div>
      </div>
      <div class="fac-meta">
        <span class="badge ${isDone?'badge-done':'badge-todo'}">${isDone?'完了':'未'}</span>
        ${isDone?`<span class="fac-cnt">${cnt}行</span>`:''}
      </div>
      <div class="fac-arrow">›</div>
    </div>`;
  }
  document.getElementById('fac-list').innerHTML = html;
}

/* ===== 施設詳細 ===== */
function openDetail(id) {
  currentId = id;
  const f = FACILITIES.find(x => x.id === id);
  if (!saved[id]) saved[id] = { surveyor: '', records: [] };
  document.getElementById('d-title').textContent = f.name;
  document.getElementById('d-name').textContent = f.name;
  document.getElementById('d-sub').innerHTML = f.addr + '<br>' + f.time + '　照明総数: ' + f.total + '台';
  updateSurveyorChips(saved[id].surveyor || '');
  renderSheet();
  show('screen-detail');
}

function selectSurveyor(name) {
  saved[currentId].surveyor = name;
  saveToDB();
  updateSurveyorChips(name);
}
function updateSurveyorChips(name) {
  document.getElementById('sc-teimoto').className = 's-chip' + (name==='定元'?' sel':'');
  document.getElementById('sc-takeda').className  = 's-chip' + (name==='武田'?' sel':'');
}

function newRow() {
  return { floor:'1F', room:'', type:'', subtype:'', form:'', color:'昼白色',
    dia:'', width:'', depth:'', phi:'', count:'', watt:'', hours:'', note:'', photos:[] };
}

function addRow() {
  saved[currentId].records.push(newRow());
  saveToDB();
  renderSheet();
  // 最下部にスクロール
  setTimeout(() => {
    const wrap = document.getElementById('sheet-wrap');
    wrap.scrollTop = wrap.scrollHeight;
  }, 50);
}

function delRow(i) {
  if (!confirm((i+1)+'行目を削除しますか？')) return;
  saved[currentId].records.splice(i, 1);
  saveToDB();
  renderSheet();
  renderList();
}

function updateCell(i, key, val) {
  saved[currentId].records[i][key] = val;
  saveToDB();
  renderList();
}

function makeSelect(i, key, options, val) {
  const sel = document.createElement('select');
  sel.className = 'cell-select';
  options.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o;
    opt.textContent = o || '—';
    if (o === val) opt.selected = true;
    sel.appendChild(opt);
  });
  // 値がリストにない場合は追加
  if (val && !options.includes(val)) {
    const opt = document.createElement('option');
    opt.value = val; opt.textContent = val; opt.selected = true;
    sel.insertBefore(opt, sel.firstChild);
  }
  sel.onchange = () => updateCell(i, key, sel.value);
  return sel;
}

function makeInput(i, key, val, type='text', placeholder='') {
  const inp = document.createElement('input');
  inp.className = 'cell-input';
  inp.type = type;
  inp.value = val || '';
  inp.placeholder = placeholder;
  inp.onchange = () => updateCell(i, key, inp.value);
  return inp;
}

function renderSheet() {
  const records = saved[currentId].records;
  const tbody = document.getElementById('sheet-tbody');
  tbody.innerHTML = '';

  records.forEach((r, i) => {
    const tr = document.createElement('tr');

    // No
    const tdNo = document.createElement('td');
    tdNo.className = 'cell-no';
    tdNo.textContent = i + 1;
    tdNo.onclick = () => tr.classList.toggle('selected');
    tr.appendChild(tdNo);

    // 階数
    const tdFloor = document.createElement('td');
    tdFloor.appendChild(makeSelect(i, 'floor', FLOORS, r.floor));
    tr.appendChild(tdFloor);

    // 室区分（テキスト入力）
    const tdRoom = document.createElement('td');
    tdRoom.appendChild(makeInput(i, 'room', r.room, 'text', '例：廊下'));
    tr.appendChild(tdRoom);

    // 種類
    const tdType = document.createElement('td');
    tdType.appendChild(makeSelect(i, 'type', TYPES, r.type));
    tr.appendChild(tdType);

    // 灯式・口金
    const tdSub = document.createElement('td');
    tdSub.appendChild(makeSelect(i, 'subtype', SUBTYPES, r.subtype));
    tr.appendChild(tdSub);

    // 形式（テキスト入力 - 自由記述も多いため）
    const tdForm = document.createElement('td');
    tdForm.appendChild(makeInput(i, 'form', Array.isArray(r.form)?r.form.join('・'):r.form, 'text', '例：逆富士'));
    tr.appendChild(tdForm);

    // 色温度
    const tdColor = document.createElement('td');
    tdColor.appendChild(makeSelect(i, 'color', COLORS, r.color));
    tr.appendChild(tdColor);

    // 台数
    const tdCount = document.createElement('td');
    tdCount.appendChild(makeInput(i, 'count', r.count, 'number', '台'));
    tr.appendChild(tdCount);

    // W数
    const tdWatt = document.createElement('td');
    tdWatt.appendChild(makeInput(i, 'watt', r.watt, 'text', 'W'));
    tr.appendChild(tdWatt);

    // 点灯時間
    const tdHours = document.createElement('td');
    tdHours.appendChild(makeSelect(i, 'hours', HOURS, r.hours));
    tr.appendChild(tdHours);

    // 直径
    const tdDia = document.createElement('td');
    tdDia.appendChild(makeInput(i, 'dia', r.dia, 'number'));
    tr.appendChild(tdDia);

    // 幅
    const tdWidth = document.createElement('td');
    tdWidth.appendChild(makeInput(i, 'width', r.width, 'number'));
    tr.appendChild(tdWidth);

    // 深さ
    const tdDepth = document.createElement('td');
    tdDepth.appendChild(makeInput(i, 'depth', r.depth, 'number'));
    tr.appendChild(tdDepth);

    // Φ数
    const tdPhi = document.createElement('td');
    tdPhi.appendChild(makeInput(i, 'phi', r.phi, 'number'));
    tr.appendChild(tdPhi);

    // 備考
    const tdNote = document.createElement('td');
    tdNote.appendChild(makeInput(i, 'note', r.note, 'text'));
    tr.appendChild(tdNote);

    // 写真
    const tdPhoto = document.createElement('td');
    const photoCnt = (r.photos||[]).length;
    const photoBtn = document.createElement('button');
    photoBtn.className = 'cell-photo-btn';
    photoBtn.innerHTML = '📷' + (photoCnt > 0 ? ' '+photoCnt : '');
    photoBtn.style.color = photoCnt > 0 ? 'var(--green)' : 'var(--blue)';
    photoBtn.onclick = () => openPhotoModal(i);
    tdPhoto.appendChild(photoBtn);
    tr.appendChild(tdPhoto);

    // 削除
    const tdDel = document.createElement('td');
    const delBtn = document.createElement('button');
    delBtn.className = 'cell-del-btn';
    delBtn.textContent = '×';
    delBtn.onclick = () => delRow(i);
    tdDel.appendChild(delBtn);
    tr.appendChild(tdDel);

    tbody.appendChild(tr);
  });

  // 行がなければ1行追加
  if (records.length === 0) addRow();
}

/* ===== 写真モーダル ===== */
function openPhotoModal(rowIdx) {
  photoModalRowIdx = rowIdx;
  document.getElementById('modal-title').textContent = (rowIdx+1)+'行目の写真';
  renderModalPhotos();
  document.getElementById('photo-modal').classList.add('active');
}

function renderModalPhotos() {
  const photos = saved[currentId].records[photoModalRowIdx].photos || [];
  const container = document.getElementById('modal-photos');
  container.innerHTML = '';
  photos.forEach((p, pi) => {
    const wrap = document.createElement('div');
    wrap.className = 'photo-thumb';
    wrap.innerHTML = `<img src="${p.dataUrl}"><button class="photo-thumb-del" onclick="removeModalPhoto(${pi})">×</button>`;
    container.appendChild(wrap);
  });
  if (photos.length < 3) {
    const addBtn = document.createElement('div');
    addBtn.className = 'photo-add-btn';
    addBtn.textContent = '＋';
    addBtn.onclick = () => document.getElementById('photo-file-input').click();
    container.appendChild(addBtn);
  }
}

function removeModalPhoto(pi) {
  saved[currentId].records[photoModalRowIdx].photos.splice(pi, 1);
  saveToDB();
  renderModalPhotos();
  renderSheet();
}

function handleModalPhoto(input) {
  const files = Array.from(input.files);
  const current = saved[currentId].records[photoModalRowIdx].photos || [];
  const remaining = 3 - current.length;
  const toLoad = files.slice(0, remaining);
  let loaded = 0;
  toLoad.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const ext = file.name.split('.').pop() || 'jpg';
      saved[currentId].records[photoModalRowIdx].photos.push({ dataUrl: e.target.result, ext });
      loaded++;
      if (loaded === toLoad.length) { saveToDB(); renderModalPhotos(); renderSheet(); }
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

function closePhotoModal() {
  document.getElementById('photo-modal').classList.remove('active');
  photoModalRowIdx = -1;
}

/* ===== Excelインポート ===== */
function triggerImport() { document.getElementById('import-input').click(); }

async function importExcel(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  try {
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

    let headerRow = -1;
    for (let i = 0; i < rows.length; i++) {
      const row = rows[i].map(v => String(v).trim());
      if (row.includes('階数') && row.includes('室区分')) { headerRow = i; break; }
    }
    if (headerRow < 0) { alert('ヘッダーが見つかりません'); return; }

    const headers = rows[headerRow].map(v => String(v).trim());
    const idx = k => headers.indexOf(k);

    const records = [];
    for (let i = headerRow + 1; i < rows.length; i++) {
      const row = rows[i];
      const floor = String(row[idx('階数')]||'').trim();
      const room  = String(row[idx('室区分')]||'').trim();
      if (!floor && !room) continue;
      const formRaw = String(row[idx('形式')]||'').trim();
      records.push({
        floor, room,
        type:    String(row[idx('種類')]||'').trim(),
        subtype: String(row[idx('灯式')]||'').trim(),
        form:    formRaw,
        color:   String(row[idx('色温度')]||'').trim(),
        dia:     String(row[idx('直径(mm)')]||'').trim(),
        width:   String(row[idx('幅(mm)')]||'').trim(),
        depth:   String(row[idx('深さ(mm)')]||'').trim(),
        phi:     String(row[idx('Φ数')]||'').trim(),
        count:   String(row[idx('台数')]||'').trim(),
        watt:    String(row[idx('W数')]||'').trim(),
        hours:   String(row[idx('点灯時間(h/日)')]||'').trim(),
        note:    String(row[idx('備考')]||'').trim(),
        photos:  []
      });
    }

    if (!records.length) { alert('データが見つかりません'); return; }
    if (!confirm(records.length+'件インポートします。既存データに追加されます。よろしいですか？')) return;

    if (!saved[currentId]) saved[currentId] = { surveyor: '', records: [] };
    saved[currentId].records.push(...records);
    saveToDB();
    renderSheet();
    renderList();
    alert(records.length+'件インポートしました！');
  } catch(e) { alert('エラー: ' + e.message); }
}

/* ===== CSV+写真保存 ===== */
async function saveAndExport() {
  const f = FACILITIES.find(x => x.id === currentId);
  const s = saved[currentId];
  if (!s || !s.records.length) { alert('データがありません'); return; }

  const fname = safeName(f.name);
  const fdate = (f.date||new Date().toISOString().slice(0,10)).replace(/-/g,'');
  const baseName = fname + '_' + fdate;

  const hdr = ['施設NO','施設名','住所','照明総数','調査者','行No','階数','室区分','種類','灯式・口金','形式','色温度','台数','W数','点灯時間','直径(mm)','幅(mm)','深さ(mm)','Φ数','写真1','写真2','写真3','備考'];
  const rows = [hdr];

  s.records.forEach((r, idx) => {
    const formVal = Array.isArray(r.form) ? r.form.join('・') : (r.form||'');
    const photoNames = (r.photos||[]).map((p,pi) => fname+'_'+(idx+1)+'行_写真'+(pi+1)+'.'+(p.ext||'jpg'));
    while (photoNames.length < 3) photoNames.push('');
    rows.push([f.id,f.name,f.addr,f.total,s.surveyor,idx+1,r.floor,r.room,r.type,r.subtype,formVal,r.color,r.count,r.watt,r.hours,r.dia,r.width,r.depth,r.phi,...photoNames,r.note||'']);
  });

  const BOM = '\uFEFF';
  const csvStr = BOM + rows.map(r => r.map(v => '"'+String(v===null||v===undefined?'':v).replace(/"/g,'""')+'"').join(',')).join('\n');

  const zip = new JSZip();
  zip.file(baseName+'.csv', csvStr);
  const photosFolder = zip.folder('photos');
  s.records.forEach((r, idx) => {
    (r.photos||[]).forEach((p, pi) => {
      const pname = fname+'_'+(idx+1)+'行_写真'+(pi+1)+'.'+(p.ext||'jpg');
      photosFolder.file(pname, p.dataUrl.split(',')[1], { base64: true });
    });
  });

  const blob = await zip.generateAsync({ type: 'blob' });
  const zipFile = new File([blob], baseName+'.zip', { type: 'application/zip' });

  if (navigator.share && navigator.canShare && navigator.canShare({ files: [zipFile] })) {
    try { await navigator.share({ files: [zipFile], title: baseName }); return; }
    catch(e) { if (e.name === 'AbortError') return; }
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = baseName+'.zip';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

}
